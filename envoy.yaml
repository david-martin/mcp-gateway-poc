admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

# Enable debug logging for router and ext_proc
static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  name: mcp_route
                  virtual_hosts:
                    - name: mcp1
                      domains: ['server1.mcp.example.com']
                      routes:
                        # Route to server1 if x-mcp-server header is "server1"
                        - match:
                            prefix: '/'
                          route:
                            cluster: server1_cluster
                    - name: mcp2
                      domains: ['server2.mcp.example.com']
                      routes:
                        # Route to server1 if x-mcp-server header is "server1"
                        - match:
                            prefix: '/'
                          route:
                            cluster: server2_cluster
                    - name: mcp_helper
                      domains: ['*']
                      routes:
                        # Default route to mcp_helper
                        - match:
                            prefix: '/'
                          route:
                            cluster: mcp_helper
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      '@type': 'type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor'
                      failure_mode_allow: false
                      message_timeout: 10s
                      mutation_rules:
                        allow_all_routing: true
                      processing_mode:
                        request_header_mode: 'SEND'
                        response_header_mode: 'SEND'
                        request_body_mode: 'BUFFERED'
                        response_body_mode: 'BUFFERED'
                        request_trailer_mode: 'SKIP'
                        response_trailer_mode: 'SKIP'
                      grpc_service:
                        envoy_grpc:
                          cluster_name: ext-proc
                  # Router filter (must be last)
                  - name: envoy.filters.http.router
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: mcp_helper
      connect_timeout: 30s
      type: LOGICAL_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: mcp_helper
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: mcp_helper
                      port_value: 8080
    - name: ext-proc
      connect_timeout: 5s
      type: strict_dns
      lb_policy: round_robin
      http2_protocol_options: {}
      load_assignment:
        cluster_name: ext-proc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: mcp_helper
                      port_value: 50051
    - name: server1_cluster
      connect_timeout: 30s
      type: LOGICAL_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: server1_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: server1
                      port_value: 8081

    - name: server2_cluster
      connect_timeout: 30s
      type: LOGICAL_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: server2_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: server2
                      port_value: 8082
